<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>六级词汇背诵</title>
<style>
/* Design tokens — 精确提取自 companion.uprock.pro */
:root{
 --bg:#000000;            /* 纯黑主背景 */
 --bg2:#17120C;           /* 暖黑区块 */
 --paper:#141414;         /* 近黑卡片 */
 --ink:#F8F8F8;           /* 白字 */
 --sub:#8A8A8A;
 --line:#2E2E2E;
 --acc:#E83080;           /* 橘色强调 */
 --acc-deep:#F5488F;
 --yel:#FFC838;           /* 黄色点缀 */
 --ok:#3DBD7E;--bad:#E05D5D;--warn:#E8A23B;
 --spring:cubic-bezier(.22,1,.36,1);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);
 font-family:'Inter',-apple-system,'SF Pro Text','PingFang SC','Helvetica Neue',sans-serif;
 font-size:17px;line-height:1.5;-webkit-font-smoothing:antialiased}
#app{max-width:760px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;padding-bottom:70px}
header{padding:24px 22px 8px;display:flex;justify-content:space-between;align-items:baseline}
header h1{font-size:17px;margin:0;font-weight:700;letter-spacing:-.05em}
header .mode{font-size:11px;color:var(--sub);border:1px solid var(--line);border-radius:4px;padding:2px 10px;background:var(--paper);font-weight:500}
main{flex:1;padding:4px 22px}
.nav{position:fixed;bottom:0;left:0;right:0;background:rgba(0,0,0,.92);backdrop-filter:blur(10px);border-top:1px solid var(--line);display:flex;z-index:50;padding-bottom:env(safe-area-inset-bottom)}
.nav button{flex:1;border:0;background:none;padding:8px 0 6px;font-size:11px;font-weight:500;letter-spacing:.02em;color:#6A6A6A;transition:color .2s}
.nav button.on{color:var(--ink);font-weight:700}
/* 会话列表 */
.sess{display:flex;align-items:center;gap:16px;padding:18px 2px;border-bottom:1px solid var(--line);cursor:pointer;transition:transform .25s var(--spring)}
.sess:first-child{border-top:1px solid var(--line)}
.sess:active{transform:scale(.99)}
.sess.done{opacity:.55}
.sess .em{width:26px;display:flex;align-items:center;justify-content:center;flex-shrink:0}.sess .em svg{width:22px;height:22px;display:block}
.sess .t{flex:1}
.sess .t b{font-size:16px;font-weight:600;letter-spacing:-.02em}
.sess .t span{display:block;font-size:13px;color:var(--sub);margin-top:2px}
.sess .st{font-size:12px;color:var(--ok);font-weight:700}
/* 今日卡：白块扁平+黄底数字 */
.today{display:flex;align-items:center;gap:22px;margin:20px 0 6px;padding:20px;background:var(--paper);border:1px solid #303030;border-radius:12px;box-shadow:0 14px 40px -16px rgba(0,0,0,.8)}
.ring{position:relative;width:88px;height:88px;flex-shrink:0}
.ring svg{transform:rotate(-90deg)}
.ring .num{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:21px;font-weight:700;letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.today .stats{flex:1}
.today .stats .r{display:flex;justify-content:space-between;padding:5px 0;font-size:14px}
.today .stats .r b{font-weight:700;font-variant-numeric:tabular-nums}
.today .stats .r span{color:var(--sub)}
.notice{padding:12px 2px;font-size:14px;color:var(--sub);border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin:14px 0}
.notice b{color:var(--ink);font-weight:700}
/* 卡片：白底扁平 + 底部黄色粗条 + 滑入 */
.card::after{content:'';position:absolute;left:0;right:0;bottom:0;height:5px;background:var(--yel);border-bottom-left-radius:12px;border-bottom-right-radius:12px}
.card{position:relative;background:var(--paper);border:1px solid #303030;border-radius:12px;padding:42px 28px 34px;margin-top:14px;overflow:hidden;overflow-wrap:break-word;word-break:break-word;min-width:0;box-shadow:0 18px 50px -16px rgba(0,0,0,.85),0 0 0 1px rgba(255,255,255,.02);
 animation:cardIn .5s var(--spring)}

@keyframes cardIn{from{opacity:0;transform:translateY(28px)}to{opacity:1;transform:none}}
.pbar{height:3px;background:rgba(255,255,255,.12);border-radius:2px;overflow:hidden;margin:14px 0 24px}
.pbar i{display:block;height:100%;background:var(--acc);transition:width .35s var(--spring)}
.meta{font-size:12px;color:var(--sub);display:flex;justify-content:space-between;flex-wrap:wrap;gap:2px 10px;letter-spacing:.04em;text-transform:uppercase;font-weight:500;min-width:0}
.meta .cnt{color:var(--acc-deep);font-weight:700}
/* 词块：Inter紧字距大字 */
.chunk{font-size:31px;font-weight:700;line-height:1.28;letter-spacing:-.045em;overflow-wrap:anywhere;hyphens:auto}
.chunk .kw{color:var(--acc-deep);animation:kwIn .45s var(--spring) both}
@keyframes kwIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.chunk .mask{filter:blur(7px);opacity:.5;user-select:none;-webkit-user-select:none;cursor:default;transition:filter .4s var(--spring),opacity .4s}
.zh{font-size:19px;color:rgba(248,248,248,.8);margin-top:14px;font-weight:500;overflow-wrap:anywhere}
.def{font-size:16px;line-height:1.6;color:rgba(248,248,248,.88);background:var(--bg);border-radius:6px;padding:12px 14px;margin-top:18px;overflow-wrap:anywhere}
.def .kw{color:var(--acc-deep);font-weight:700}
.mn{font-size:14px;color:var(--sub);margin-top:12px;padding:10px 14px;background:rgba(255,255,255,.06);border-radius:6px;overflow-wrap:anywhere}
.syn,.ex{font-size:14px;color:var(--sub);margin-top:12px;padding-left:14px;border-left:3px solid var(--yel);overflow-wrap:anywhere;min-width:0}
.ex i{color:rgba(255,255,255,.5)}
.btnrow{display:flex;justify-content:center;gap:10px;margin-top:30px}
.btnrow .big:only-child{flex:0 1 auto;min-width:44%}
button{font-family:inherit}
.big{flex:1;min-width:0;border:1.5px solid var(--line);background:var(--paper);border-radius:999px;padding:11px 20px;font-size:15.5px;font-weight:700;letter-spacing:-.01em;color:var(--ink);cursor:pointer;white-space:nowrap;transition:transform .18s var(--spring),background .15s,color .15s,border-color .15s,box-shadow .2s}
.big:active{transform:scale(.97)}
.big:hover{background:var(--yel);border-color:var(--yel);color:#111}
.b-pri{background:var(--acc);border-color:var(--acc);color:#fff;box-shadow:0 5px 16px -7px rgba(232,48,128,.5)}
.b-pri:hover{background:var(--acc-deep);border-color:var(--acc-deep);box-shadow:0 6px 18px -7px rgba(232,48,128,.55)}
.g1{-webkit-text-fill-color:#E84444;color:#E84444}
.g2{background:linear-gradient(175deg,#F7CC85 8%,#D89230 92%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.g3{background:linear-gradient(175deg,#6FD8A6 8%,#35A878 92%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.g3:hover{background:rgba(61,189,126,.12);-webkit-text-fill-color:#4CC08A;border-color:#2A4A3A}
.g1:hover{-webkit-text-fill-color:#FF5C5C}.g2:hover{-webkit-text-fill-color:#E8A23B}
.spk{border:1.5px solid var(--line);background:var(--paper);border-radius:999px;min-width:48px;padding:7px 13px;font-size:14px;font-weight:700;cursor:pointer;transition:transform .18s var(--spring),background .15s}
.spk:hover{background:var(--yel);border-color:var(--yel)}
/* 顶栏 */
.top{display:flex;align-items:center;gap:14px;padding:18px 4px 0}
.xbtn{width:34px;height:34px;border-radius:8px;border:1.5px solid var(--ink);background:var(--paper);font-size:14px;line-height:1;color:var(--ink);cursor:pointer;flex-shrink:0;font-weight:600;transition:transform .25s var(--spring),background .15s}
.xbtn:active{transform:rotate(90deg)}
.xbtn:hover{background:var(--yel);border-color:var(--ink)}
.top .tt{flex:1;text-align:center;font-size:15px;font-weight:700;letter-spacing:-.02em}
.top .cnt{font-size:13px;color:var(--sub);white-space:nowrap;font-variant-numeric:tabular-nums}
.top .cnt b{color:var(--acc-deep)}
@media(min-width:900px){
 #app{max-width:1060px}
 .studywrap{display:grid;grid-template-columns:250px minmax(0,1fr);gap:26px}
 .qside{border-right:1px solid var(--line);padding:14px 16px 40px 0;max-height:82vh;overflow:auto}
 .qside h4{font-size:11px;color:var(--sub);letter-spacing:.09em;text-transform:uppercase;margin:8px 0;font-weight:700}
 .qitem{padding:7px 10px;border-radius:6px;font-size:13px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
 .qitem.now{background:var(--paper);border-left:3px solid var(--acc);color:var(--ink);font-weight:600}
 .qitem.done{opacity:.4;text-decoration:line-through}
}
.qside{display:none}
@media(min-width:900px){.qside{display:block}.studywrap{display:grid;grid-template-columns:250px minmax(0,1fr);gap:26px}}
.grid40{display:grid;grid-template-columns:repeat(5,1fr);gap:13px;margin-top:6px}
.grid40 button{aspect-ratio:1;border:none;border-radius:11px;background:var(--paper);font-size:13px;cursor:pointer;color:var(--sub);font-weight:500;transition:all .15s var(--spring)}
.grid40 button.done{background:linear-gradient(180deg,rgba(255,200,56,.14) 0%,rgba(255,200,56,.22) 100%);color:#E8C25A;font-weight:600}
.grid40 button.cur{background:rgba(232,48,128,.28);color:#F76CA8;font-weight:700;box-shadow:0 0 12px rgba(232,48,128,.28)}
.grid40 button.hot{background:rgba(224,93,93,.15);color:#E07070;font-weight:600}
.grid40 button.done.hot{background:linear-gradient(180deg,rgba(255,200,56,.12) 0%,rgba(224,93,93,.18) 100%);color:#E0A070}
.row{display:flex;align-items:center;gap:12px;padding:13px 2px;border-bottom:1px solid var(--line);cursor:pointer}
.row .mk{width:20px;text-align:center;font-size:14px;flex-shrink:0;color:var(--sub)}
.row .mk.tri{color:var(--warn)}.row .mk.cir{color:var(--bad)}.row .mk.ok{color:var(--ok)}
.row .rc{flex:1;min-width:0}
.row .rc b{font-size:15px;font-weight:600;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.01em}
.row .rc span{font-size:13px;color:var(--sub)}
.set{padding:20px 0;border-top:1px solid var(--line);margin:8px 0}
.set h3{margin:0 0 4px;font-size:12px;color:var(--sub);font-weight:700;letter-spacing:.09em;text-transform:uppercase}
.set label{display:flex;justify-content:space-between;align-items:center;padding:9px 0;font-size:15.5px}
.sw{position:relative;width:44px;height:26px;background:#2A2A2A;border-radius:99px;transition:.2s;cursor:pointer;flex-shrink:0}
.sw.on{background:var(--acc)}
.sw::after{content:'';position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s}
.sw.on::after{left:21px}
input[type=date],select,input[type=text]{font-size:15px;padding:6px 8px;border:1.5px solid var(--line);border-radius:6px;background:var(--paper);color:var(--ink)}
input[type=radio],input[type=checkbox]{accent-color:#F97316;width:17px;height:17px;cursor:pointer}
textarea{width:100%;height:70px;font-size:12px;border:1px solid var(--line);border-radius:6px;padding:8px}
.fin{text-align:center;padding:80px 20px}
.fin h2{font-weight:700;font-size:26px;letter-spacing:-.05em;line-height:1}
.fin p{color:var(--sub);font-size:15px}
.small{font-size:13px;color:var(--sub)}
h2.pg{font-size:13px;color:var(--sub);margin:22px 4px 8px;font-weight:700;letter-spacing:.09em;text-transform:uppercase}
#q{width:100%;padding:12px 4px;font-size:17px;border:0;border-bottom:2px solid var(--line);border-radius:0;margin:8px 0 16px;background:transparent;color:var(--ink);font-weight:500}
#q:focus{outline:none;border-bottom-color:var(--acc)}
#q::placeholder{color:#666}
input[type=date]{color-scheme:dark}
input,select,button{color-scheme:dark}
@media(min-width:640px){.chunk{font-size:36px}}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

/* List详情头部 */
.listhead{padding:22px 22px 16px;display:flex;align-items:center;gap:16px;border-bottom:1px solid var(--line)}
.listhead h2{margin:0;font-size:30px;font-weight:700;letter-spacing:-.05em;line-height:1}
.lh-t{flex:1}
.lh-n{display:block;font-size:13px;color:var(--sub);margin-top:4px;font-weight:500}
.lh-n b{color:var(--acc-deep);font-weight:700;font-variant-numeric:tabular-nums}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;border-radius:99px;padding:4px 11px;letter-spacing:.02em}
.chip-tri{background:rgba(255,200,56,.14);color:#E8C25A}
.chip-cir{background:rgba(224,93,93,.18);color:#E07070;margin-left:6px}
.chip-ok{background:rgba(61,189,126,.14);color:#4CC08A}
/* 行卡片化 */
main .row{display:flex;align-items:center;gap:12px;padding:13px 14px;border:1px solid transparent;border-bottom-color:var(--line);cursor:pointer;background:transparent;border-radius:0;margin:0;transition:background .15s,border-color .15s,transform .18s var(--spring)}
main .row:first-of-type{margin-top:8px}
main .row:hover{background:var(--paper);border-color:var(--line);border-radius:8px}
main .row:active{transform:scale(.99)}
main .row .idx{font-size:11px;color:rgba(255,255,255,.3);font-variant-numeric:tabular-nums;font-weight:600;width:20px;flex-shrink:0}
main .row .arr{color:rgba(255,255,255,.28);font-size:18px;line-height:1;flex-shrink:0;transition:color .15s,transform .18s var(--spring)}
main .row:hover .arr{color:var(--acc);transform:translateX(2px)}

/* 进度页四格数据卡 */
.statrow{display:flex;background:var(--paper);border:1px solid #303030;border-radius:12px;margin:18px 0 20px;padding:22px 6px;box-shadow:0 14px 40px -16px rgba(0,0,0,.8)}
.statrow .s{flex:1;text-align:center;padding:0 6px;min-width:0}
.statrow .s+.s{border-left:1px solid var(--line)}
.statrow .s b{display:block;font-size:26px;font-weight:700;letter-spacing:-.05em;line-height:1;font-variant-numeric:tabular-nums}
.statrow .s span{display:block;font-size:10.5px;color:var(--sub);letter-spacing:.09em;text-transform:uppercase;font-weight:700;margin-top:7px}
.statrow .s:nth-child(1) b{color:#E83080}
.statrow .s:nth-child(2) b{color:#4CC98A}
.statrow .s:nth-child(3) b{color:#F2D06B}
.statrow .s:nth-child(4) b{color:#F06565}

/* 分段滑条评分器 */
.seg{display:flex;position:relative;background:var(--paper);border:1.5px solid var(--line);border-radius:999px;padding:4px;margin-top:30px}
.seg .thumb{position:absolute;top:4px;bottom:4px;left:4px;width:calc((100% - 8px)/3);background:var(--acc);border-radius:999px;transition:transform .3s var(--spring),background .2s;box-shadow:0 4px 12px -6px rgba(232,48,128,.55);pointer-events:none}
.seg.seg2 .thumb{width:calc((100% - 8px)/2)}
.seg button{flex:1;position:relative;z-index:1;border:0;background:none;padding:9px 0;font-size:15px;font-weight:700;letter-spacing:-.01em;color:var(--ink);cursor:pointer;border-radius:999px;transition:color .2s;font-family:inherit;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seg button.on{color:#fff}
.seg button:not(.on):hover{color:var(--acc-deep)}

/* 设置页分段滑条(窄) */
.segline{display:flex;position:relative;background:var(--paper);border:1.5px solid var(--line);border-radius:999px;padding:3px;flex:0 0 210px}
.segline .thumb{position:absolute;top:3px;bottom:3px;left:3px;width:calc(50% - 3px);background:var(--acc);border-radius:999px;transition:transform .3s var(--spring);pointer-events:none}
.segline button{flex:1;position:relative;z-index:1;border:0;background:none;padding:9px 0;font-size:14px;font-weight:700;color:var(--ink);cursor:pointer;border-radius:999px;transition:color .2s;font-family:inherit;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.segline button.on{color:#fff}
.scene{--h:210;font-size:54px;line-height:1.25;margin:14px 0 4px;padding:20px 12px;border-radius:18px;background:hsl(var(--h) 30% 13%);border:1px solid hsl(var(--h) 32% 24%);letter-spacing:8px;text-align:center;user-select:none;-webkit-user-select:none;filter:saturate(1.15)}
.scene.pop{animation:scenepop .5s var(--spring)}
@keyframes scenepop{0%{transform:scale(.9)}55%{transform:scale(1.045)}100%{transform:scale(1)}}
</style>
</head>

/* ---------- date utils ---------- */
function tstr(d){d=d||new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function parseD(s){const p=s.split('-');return new Date(+p[0],+p[1]-1,+p[2])}

/* ---------- chunk helpers ---------- */
function esc(s){return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function wordRegex(w){
  const toks=w.toLowerCase().split(/\s+/).filter(t=>t&&!STOP.has(t));
  toks.sort((a,b)=>b.length-a.length);
  return new RegExp('\\b('+toks.map(t=>t.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('|')+')\\b','gi');
}
function maskChunk(ce,w){
  if(!w)return esc(ce);
  const re=wordRegex(w);
  return esc(ce).replace(re,m=>'<span class="mask">'+m+'</span>');
}
function hlChunk(ce,w){
  if(!w)return esc(ce);
  const re=wordRegex(w);
  return esc(ce).replace(re,m=>'<span class="kw">'+m+'</span>');
}

function grade(id,lvl){ // 3=认识 2=模糊 1=不认识
  if(lvl===3){delete S.marks[id]}
  else if(lvl===2){S.marks[id]='tri'}
  else{S.marks[id]='cir'}
  const c=DATA.find(x=>x.i===id);
  const sm=S.sm2[id]||{d:tstr(),iv:0,ef:2.5};
  if(lvl===3){sm.iv=sm.iv<1?3:Math.round(sm.iv*sm.ef);sm.ef=Math.min(2.8,sm.ef+.05)}
  else if(lvl===2){sm.iv=1;sm.ef=Math.max(1.3,sm.ef-.2)}
  else{sm.iv=0;sm.ef=Math.max(1.3,sm.ef-.35)}
  const dd=parseD(tstr());dd.setDate(dd.getDate()+Math.max(sm.iv,1));
  sm.d=tstr(dd);S.sm2[id]=sm;save();
}

function calcStreak(){let n=0;const d=new Date();while(true){const s=S.sessions[tstr(d)];if(s&&(s.am||s.noon||s.bed)){n++;d.setDate(d.getDate()-1)}else break}return n}
function dueSm2(today){return DATA.filter(c=>{const sm=S.sm2[c.i];return sm&&sm.d<=today})}

/* ---------- session player ---------- */
let Q=null; // {key, cards:[], idx, done, t0}
function chunkPass(iv){return iv>=14?4:iv>=6?3:iv>=3?2:1}
// 交错混排：首轮按顺序认识新词，之后每个新词在本次学习内再出现2次（第2、3轮），
// 穿插在其余新词之间；只有某词最后一次出现才计入评分（stage==='final'）。
function interleaveCards(list){
  const N=list.length;
  // 轮次间隔：第2次出现推后BATCH个，第3次再推后BATCH个。BATCH随规模自适应。
  const BATCH=Math.max(3,Math.round(N/12));  // 74词→6；先学6个再回头考
  const queue=[];
  // 每个词3次出现：stage 0=初识(给答案) 1=回忆 2=终考(记分)
  const pending=list.map((c,i)=>({c,nextAt:i,stage:0,seq:i}));
  let order=[...pending];
  // 用事件驱动：维护一个按 nextAt 排序的堆式列表
  const out=[];
  const remaining=new Map(); // seq -> 剩余出现次数
  pending.forEach(p=>remaining.set(p.seq,[0,1,2]));
  // 用简单的优先队列模拟 (规模小，直接排序)
  const pq=[...pending.map(p=>({...p}))];
  const appears=new Map(); // seq -> 已出现次数
  pending.forEach(p=>appears.set(p.seq,0));
  let clock=0;
  while(pq.length){
    pq.sort((a,b)=>a.nextAt-b.nextAt||a.seq-b.seq);
    const cur=pq.shift();
    const n=appears.get(cur.seq);
    const isFinal=(n===2);
    out.push({c:cur.c,pass:0,skim:false,round:n+1,last:isFinal,seq:cur.seq});
    appears.set(cur.seq,n+1);
    if(n<2){  // 还要再出现
      cur.nextAt=clock+BATCH;
      cur.stage=n+1;
      pq.push(cur);
    }
    clock++;
  }
  return out;
}
function buildCards(list,pass,onlyMarked,skimUnmarked){
  const chunks=BYLIST[list]||[];
  const marked=chunks.filter(c=>['tri','cir'].includes(mark(c.i)));
  const rest=chunks.filter(c=>!['tri','cir'].includes(mark(c.i)));
  let cards=[];
  for(const c of marked)cards.push({c,pass,skim:false});
  if(skimUnmarked)for(const c of rest)cards.push({c,pass:Math.max(pass,1),skim:true});
  if(onlyMarked&&!skimUnmarked)cards=marked.map(c=>({c,pass,skim:false}));
  return cards;
}
function startSession(key){

    cards=interleaveCards(BYLIST[nl]);

  }else if(key==='noon'){
    if(!nl){alert(T('No quick review today','今天没有快过任务'));return}

    title=T(`Noon · Quick Review List ${nl}`,`午/晚 · 快过 List ${nl}`);
  }else{ // bed
    let parts=[];
    if(S.mode==='richard'){
      parts=dueListsRichard(row);
      cards=[];
      for(const d of parts)cards=cards.concat(buildCards(d.L,d.pass,false,S.set.bedAll));
      title=T('Bedtime · Review','睡前 · 串览')+(parts.length?' · '+parts.map(d=>'L'+d.L).join(' '):'');

      const due=dueSm2(today);
      const pri=c=>mark(c.i)==='cir'?0:mark(c.i)==='tri'?1:2;
      due.sort((a,b)=>pri(a)-pri(b));
      cards=due.map(c=>({c,pass:chunkPass(S.sm2[c.i].iv),skim:!['tri','cir'].includes(mark(c.i))}));
      title=T('Bedtime · Smart Review','睡前 · 智能复习')+' ('+due.length+')';
    }
    if(!cards.length){S.sessions[today].bed=true;save();render();return}
  }
  Q={key,cards,idx:0,title,ans:new Array(cards.length).fill(null),t0:Date.now()};
  renderCard();
}

      : (skim

        :(pass===4

          :`<div class="seg" id="seg"><div class="thumb" id="segThumb"></div><button data-a="grade" data-l="1">${T('Again','不认识')}</button><button data-a="grade" data-l="2">${T('Hard','模糊')}</button><button data-a="grade" data-l="3">${T('Good','认识')}</button></div>`));
    let depth='';
    if(pass>=1&&c.se&&c.se.length){const s1=c.se[0];depth+=`<div class="def">${hlChunk(s1.e||'',c.w)}${s1.z?` <span class="small">（${esc(s1.z)}${s1.p?' '+esc(s1.p):''}）</span>`:''}</div>`}
    if(pass>=2){
      if(c.m&&c.m.length)depth+=`<div class="mn">${T('Root: ','[记] ')}${esc(c.m[0])}</div>`;
      if(c.se&&c.se[0]&&c.se[0].x&&c.se[0].x.length)depth+=`<div class="ex">${T('Ex: ','[例] ')}<i>${esc(c.se[0].x[0])}</i></div>`;
      if(c.y&&c.y.length)depth+=`<div class="syn">${T('Syn: ','[同] ')}${esc((c.y[0].w||[]).slice(0,8).join(', '))}</div>`;
    }
    inner=`${meta}<div class="card"><div class="chunk">${hlChunk(c.ce,c.w)}</div>
    ${(S.set.pic!==false)&&c.g?`<div class="scene pop" style="--h:${hue(c.i)}">${c.g}</div>`:''}
    ${c.cz?`<div class="zh">${esc(c.cz)}</div>`:''}
    ${pass===4&&Q.ans[Q.idx]?`<div class="small" style="margin-top:6px">${T('Result: ','验收：')}<b style="color:${Q.ans[Q.idx].ok?'var(--ok)':'var(--red)'}">${Q.ans[Q.idx].ok?T('Correct','✓ 正确'):T('Answer: ','✗ 应为 ')+esc(c.w)}</b></div>`:''}
    ${depth}
    <div class="btnrow"><button class="spk" data-a="speak">${T('Play audio','发音')}</button></div>
    ${gradeBtns}</div>`;
  }
  const est=Math.max(1,Math.round(Q.cards.length/4));
  shell(`<div class="top"><button class="xbtn" data-a="quit">&#10005;</button><span class="tt">${esc(Q.title)}</span><span class="cnt"><b>${Q.cards.length}</b> &times; ${est} min</span></div>
  <div class="studywrap"><aside class="qside"><h4>${T('Queue','队列')}</h4>${Q.cards.map((qc,i)=>`<div class="qitem ${i===Q.idx?'now':(i<Q.idx?'done':'')}">${esc(qc.c.ce)}</div>`).join('')}</aside><main>${inner}</main></div>`);
}
function quizOpts(c){
  const pool=(BYLIST[c.l]||[]).filter(x=>x.w&&x.w!==c.w).map(x=>x.w);
  const uniq=[...new Set(pool)].sort(()=>Math.random()-.5).slice(0,3);
  let i=0;while(uniq.length<3&&i<DATA.length){const w=DATA[i++].w;if(w&&w!==c.w&&!uniq.includes(w))uniq.push(w)}
  return [...uniq,c.w].sort(()=>Math.random()-.5);
}
app.addEventListener('click',e=>{
  const t=e.target.closest('[data-a],[data-q]');if(!t||!Q)return;
  const a=t.dataset.a,q=t.dataset.q,card=Q.cards[Q.idx],c=card.c,pass=card.pass,skim=card.skim;
  const isFinal=!(card.round&&card.round<3);   // 交错模式：非最后一轮不记分
  if(a==='quit'){Q=null;NAV='home';render();return}
  if(a==='speakList'){speak(c.ce);return}
  if(a==='reveal'){Q.ans[Q.idx]={};renderCard();if(S.set.tts)speak(c.ce);return}
  if(a==='speak'){speak(c.ce);return}
  if(a==='mark'||a==='grade'){
    const seg=app.querySelector('#seg'),thumb=app.querySelector('#segThumb');
    const btns=seg?Array.from(seg.querySelectorAll('button')):[];
    const idx=btns.indexOf(t);
    if(seg&&thumb&&idx>=0){
      thumb.style.transform=`translateX(${idx*100}%)`;
      btns.forEach((b,i)=>b.classList.toggle('on',i===idx));
      const lvl=+t.dataset.l;
      setTimeout(()=>{if(a==='grade'&&isFinal){grade(c.i,lvl);Q.ans[Q.idx].lvl=lvl}else if(a==='mark'){if(mark(c.i)!=='cir')S.marks[c.i]='tri';save()}next()},900);
      return;
    }
    if(a==='grade'){if(isFinal){grade(c.i,+t.dataset.l);Q.ans[Q.idx].lvl=+t.dataset.l}}else{if(mark(c.i)!=='cir')S.marks[c.i]='tri';save()}
    next();return;
  }
  if(a==='next'){next();}
  if(q!==undefined&&pass===4){
    const ok=q.toLowerCase()===c.w.toLowerCase();
    grade(c.i,ok?3:1);
    Q.ans[Q.idx]={ok};renderCard();
  }
});
function next(){Q.idx++;renderCard()}
function finishSession(){
  const today=tstr(),secs=Math.round((Date.now()-Q.t0)/1000);
  const key=Q.key;S.sessions[today]=S.sessions[today]||{};
  S.sessions[today][key]=true;
  if(key==='am'){const nl=newListFor(rowOf(today));if(nl&&!S.learned.includes(nl)){S.learned.push(nl);S.learned.sort((a,b)=>a-b)}}
  save();
  const mins=Math.floor(secs/60),sec=secs%60;
  shell(`<main><div class="fin"><h2>${T('Session Complete','本次完成！')}</h2>
  <p>${esc(Q.title)}<br>${T(`${Q.cards.length} chunks`,`${Q.cards.length} 个词块`)} · ${T(`${mins}m ${sec}s`,`${mins}分${sec}秒`)}</p>
  <div class="btnrow"><button class="big b-pri" data-a="home">${T('Home','回首页')}</button></div></div></main>`);
  Q=null;
  app.querySelector('[data-a=home]').onclick=()=>{NAV='home';render()};
}

/* ---------- browse ---------- */
let curList=null,query='';
function renderBrowse(){
  if(curList)return renderListDetail();
  let rows='';
  const q=query.trim().toLowerCase();
  let results=null;
  if(q){results=DATA.filter(c=>(c.w&&c.w.includes(q))||c.ce.toLowerCase().includes(q)).slice(0,60)}
  const cells=Array.from({length:TOTAL_LISTS},(_,i)=>{
    const L=i+1,done=S.learned.includes(L);
    return `<button data-l="${L}" class="${done?'done':''} ${rowOf(tstr())===L?'cur':''}">${L}</button>`}).join('');
  shell(`<header><h1>${T('Lists','词表')}</h1></header><main>
    <div style="position:relative;margin:8px 0 4px">
      <input type="text" id="q" placeholder="${T('Search word or chunk…','搜索单词或词组…')}" style="width:100%;padding:12px 4px;font-size:17px;border:0;border-bottom:2px solid var(--line);border-radius:0;background:transparent;color:var(--ink);font-weight:500" value="${esc(query)}" autocomplete="off">
      <button id="qclear" aria-label="clear" style="position:absolute;right:0;top:50%;transform:translateY(-50%);width:28px;height:28px;border-radius:999px;border:1.5px solid var(--ink);background:var(--paper);font-size:12px;line-height:1;color:var(--ink);cursor:pointer;display:${query.trim()?'flex':'none'};align-items:center;justify-content:center;font-weight:600;padding:0">&#10005;</button>
    </div>
    <div class="small" id="qhint" style="padding:2px 4px 6px">${T('Type a word or phrase · Enter to search','输入单词或词组 · 回车搜索')}</div>
    <div id="qresults">${query.trim()?searchResults(query):'<div class="grid40" style="margin-top:8px">'+cells+'</div>'}</div>
  </main>`);
  const inp=app.querySelector('#q');
  const res=app.querySelector('#qresults'),hint=app.querySelector('#qhint');
  let deb=null;
  const clr=app.querySelector('#qclear');
  const doSearch=()=>{const v=inp.value;query=v;res.innerHTML=v.trim()?searchResults(v):('<div class="grid40" style="margin-top:8px">'+cells+'</div>');hint.style.display=v.trim()?'block':'none';clr.style.display=v.trim()?'flex':'none';bindRows()};
  clr.onclick=()=>{inp.value='';doSearch();inp.focus()};
  inp.oninput=()=>{clearTimeout(deb);deb=setTimeout(doSearch,350)};
  inp.onkeydown=e=>{if(e.key==='Enter'){clearTimeout(deb);doSearch()}};
  const bindRows=()=>{app.querySelectorAll('#qresults .row').forEach(r=>r.onclick=()=>viewCard(r.dataset.id));
    app.querySelectorAll('#qresults .grid40 button').forEach(b=>b.onclick=()=>{curList=+b.dataset.l;render()})};
  bindRows();
  app.querySelectorAll('.grid40 button').forEach(b=>b.onclick=()=>{curList=+b.dataset.l;render()});
  app.querySelectorAll('.row').forEach(r=>r.onclick=()=>viewCard(r.dataset.id));
}

function searchResults(q){
  const terms=q.toLowerCase().split(/\s+/).filter(t=>t.length>0);
  if(!terms.length)return '';
  let hits=DATA.filter(c=>{
    const blob=((c.w||'')+' '+(c.ce||'')+' '+(c.cz||'')).toLowerCase();
    return terms.every(t=>blob.includes(t));
  });
  hits=hits.slice(0,80);
  return hits.length?hits.map(c=>rowHtml(c)).join(''):('<div class="notice">'+T('No results','没有找到')+'</div>');
}

function rowHtml(c,idx){const n=typeof idx==='number'?String(idx+1).padStart(2,'0'):'';return `<div class="row" data-id="${c.i}"><span class="mk ${mark(c.i)}">${markIcon(c.i)}</span><span class="idx">${n}</span><span class="rc"><b>${esc(c.ce)}</b><span>${esc(c.cz||c.w||'')}</span></span><span class="arr">&#8250;</span></div>`}
function renderListDetail(){
  const chunks=BYLIST[curList]||[];
  const tri=chunks.filter(c=>mark(c.i)==='tri').length,cir=chunks.filter(c=>mark(c.i)==='cir').length;
  const badge=tri+cir
    ?`<span class="chip chip-tri">&#9651; ${tri}</span><span class="chip chip-cir">&#9675; ${cir}</span>`
    :`<span class="chip chip-ok">${T('All clear','全部过关')}</span>`;
  shell(`<div class="listhead">
    <button class="xbtn" data-a="backLists" aria-label="back">&#8592;</button>
    <div class="lh-t"><h2>List ${curList}</h2><span class="lh-n"><b>${chunks.length}</b> ${T('chunks','词块')}</span></div>
    <div class="lh-b">${badge}</div>
  </div>
  <main>${chunks.map((c,i)=>rowHtml(c,i)).join('')}</main>`);
  app.querySelector('[data-a=backLists]').onclick=()=>{curList=null;render()};
  app.querySelectorAll('.row').forEach(r=>r.onclick=()=>viewCard(r.dataset.id));
}
function viewCard(id){
  const c=DATA.find(x=>x.i===id);if(!c)return;
  let depth='';
  if(c.se&&c.se[0]){const s1=c.se[0];depth=`<div class="def">${hlChunk(s1.e||'',c.w)}${s1.z?` <span class="small">（${esc(s1.z)}）</span>`:''}</div>`;
    if(c.m&&c.m.length)depth+=`<div class="mn">${T('Root: ','[记] ')}${esc(c.m[0])}</div>`;
    if(s1.x&&s1.x.length)depth+=`<div class="ex">${T('Ex: ','[例] ')}<i>${esc(s1.x[0])}</i></div>`;}
  overlay(`<div class="card"><div class="meta"><span>List ${c.l} · p${c.page||'?'}</span><span>${markIcon(c.i)}</span></div>
  <div class="chunk">${hlChunk(c.ce,c.w)}</div>${c.cz?`<div class="zh">${esc(c.cz)}</div>`:''}${depth}
  <div class="btnrow"><button class="spk" id="ovSpk">Play</button><button class="big b-sec" id="ovClose">${T('Close','关闭')}</button></div></div>`);
  document.getElementById('ovSpk').onclick=()=>speak(c.ce);
  document.getElementById('ovClose').onclick=closeOverlay;
}
function overlay(html){
  const o=document.createElement('div');o.id='ovl';
  o.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:99;display:flex;align-items:center;justify-content:center;padding:20px;overflow:auto';
  o.innerHTML=`<div style="max-width:560px;width:100%;max-height:86vh;overflow:auto;min-width:0">${html}</div>`;
  o.onclick=e=>{if(e.target===o)closeOverlay()};
  document.body.appendChild(o);
}
function closeOverlay(){const o=document.getElementById('ovl');if(o)o.remove()}

/* ---------- stats ---------- */
function renderStats(){
  const cells=Array.from({length:TOTAL_LISTS},(_,i)=>{
    const L=i+1,ch=BYLIST[L]||[];
    const cir=ch.filter(c=>mark(c.i)==='cir').length;
    const done=S.learned.includes(L);
    const hot=cir>ch.length*.3;
    return `<button data-l="${L}" class="${done?'done':''} ${hot?'hot':''}">${L}</button>`}).join('');
  let tri=0,cir=0,ok=0;for(const id in S.marks){if(S.marks[id]==='tri')tri++;else if(S.marks[id]==='cir')cir++;else ok++}
  shell(`<header><h1>${T('Progress','进度')}</h1></header><main>
  <div class="statrow"><div class="s"><b>${S.learned.length}/40</b><span>${T('Groups Done','已学 List')}</span></div><div class="s"><b>${ok}</b><span>${T('Mastered','通关')}</span></div><div class="s"><b>${tri}</b><span>${T('Marked','△不熟')}</span></div><div class="s"><b>${cir}</b><span>${T('Unknown','○不会')}</span></div></div>
  <div class="grid40">${cells}</div>
  <p class="small" style="margin-top:12px">${T('Green = learned · Red = many unknown · Tap a cell','绿=已学 · 红=生词多 · 点格查看')}</p></main>`);
  app.querySelectorAll('.grid40 button').forEach(b=>b.onclick=()=>{curList=+b.dataset.l;NAV='browse';render()});
}

/* ---------- settings ---------- */
function renderSet(){
  shell(`<header><h1>${T('Settings','设置')}</h1></header><main>
  <div class="set"><h3>${T('Language','界面语言')}</h3>
  <div style="display:flex;align-items:center;justify-content:space-between;gap:14px;padding:6px 0">
    <span style="font-size:15.5px">${T('Interface language','界面显示')}</span>
    <div class="segline" id="segLang"><div class="thumb" ${S.set.lang==='zh'?'style="transform:translateX(100%)"':''}></div><button data-v="en" class="${S.set.lang!=='zh'?'on':''}">English</button><button data-v="zh" class="${S.set.lang==='zh'?'on':''}">中文</button></div>
  </div></div>
  <div class="set"><h3>${T('Schedule','调度模式')}</h3>
  <div style="display:flex;align-items:center;justify-content:space-between;gap:14px;padding:6px 0">
    <span style="font-size:15.5px">${T('Scheduler','排程方式')}</span>
    <div class="segline" id="segMode"><div class="thumb" ${S.mode==='sm2'?'style="transform:translateX(100%)"':''}></div><button data-v="richard" class="${S.mode==='richard'?'on':''}">${T('20-Day','20天计划')}</button><button data-v="sm2" class="${S.mode==='sm2'?'on':''}">${T('SM-2','智能')}</button></div>
  </div>
  <p class="small" style="margin-top:6px">${T('Smart mode: Bedtime reviews all due chunks by your grades. Morning/Noon still follow the plan. Switch anytime.','智能模式：睡前复习所有到期词块（按自评算间隔），早/午晚仍跟20天计划，随时切换。')}</p></div>
  <div class="set"><h3>${T('Session','学习')}</h3>
  <label>${T('Auto-pronounce on reveal','揭示后自动发音')}<span class="sw ${S.set.tts?'on':''}" data-t="tts"></span></label>
  <label>${T('Picture cues on cards','图片提示（看词想画面）')}<span class="sw ${S.set.pic!==false?'on':''}" data-t="pic"></span></label>
  <label>${T('Bedtime includes unmarked chunks','睡前串览含未标记词块')}<span class="sw ${S.set.bedAll?'on':''}" data-t="bedAll"></span></label>
  <label>${T('Start date','起始日期')}<input type="date" id="startDate" value="${S.start}"></label>
  <p class="small" style="margin-top:6px">${T('Picture cues show a scene for each chunk so the word links straight to an image, like learning your first language.','图片提示：每个词块配一幅场景图，建立“词—画面”直接反射，不经翻译。仅部分词条配图。')}</p></div>
  <div class="set"><h3>${T('Backup','数据备份')}</h3>
  <div class="btnrow"><button class="big b-sec" data-a="exp">${T('Export','导出进度')}</button><button class="big b-sec" data-a="imp">${T('Import','导入进度')}</button></div>
  <input type="file" id="impFile" accept=".json" style="display:none">
  <p class="small" style="margin-top:8px">${T('Save the exported json (e.g. WeChat File Transfer) to restore on another device.','导出的 json 发到微信文件传输助手，即可在新设备恢复。')}</p></div>
  <div class="set"><h3>${T('Danger Zone','危险区')}</h3><div class="btnrow"><button class="big g1" data-a="reset">${T('Reset all progress','清空全部进度')}</button></div></div>
  </main>`);
  const bindSeg=(id,apply)=>{const seg=app.querySelector(id);if(!seg)return;
    const thumb=seg.querySelector('.thumb'),btns=Array.from(seg.querySelectorAll('button'));
    btns.forEach((b,i)=>b.onclick=()=>{
      thumb.style.transform=`translateX(${i*100}%)`;
      btns.forEach((x,j)=>x.classList.toggle('on',j===i));
      setTimeout(()=>{apply(b.dataset.v);save();render()},200);
    });};
  bindSeg('#segMode',v=>{S.mode=v});
  bindSeg('#segLang',v=>{S.set.lang=v});
  app.querySelectorAll('.sw').forEach(sw=>sw.onclick=()=>{S.set[sw.dataset.t]=!S.set[sw.dataset.t];save();render()});
  app.querySelector('#startDate').onchange=e=>{if(e.target.value){S.start=e.target.value;save();render()}};
  app.querySelector('[data-a=exp]').onclick=exportData;
  app.querySelector('[data-a=imp]').onclick=()=>app.querySelector('#impFile').click();
  app.querySelector('#impFile').onchange=importData;
  app.querySelector('[data-a=reset]').onclick=()=>{if(confirm(T('Erase ALL progress? This cannot be undone.','确定清空全部学习进度？不可恢复。'))){S=defState();save();NAV='home';render()}};
}
function exportData(){
  const blob=new Blob([JSON.stringify({marks:S.marks,sm2:S.sm2,sessions:S.sessions,learned:S.learned,start:S.start,mode:S.mode,set:S.set})],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='toefl-progress-'+tstr()+'.json';a.click();
}
function importData(e){
  const f=e.target.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=()=>{try{const d=JSON.parse(r.result);
    if(d.marks)S.marks=d.marks;if(d.sm2)S.sm2=d.sm2;if(d.sessions)S.sessions=d.sessions;
    if(d.learned)S.learned=d.learned;if(d.start)S.start=d.start;if(d.mode)S.mode=d.mode;if(d.set)S.set=d.set;
    save();alert(T('Imported','导入成功'));NAV='home';render();
  }catch(err){alert(T('Invalid file','文件格式不对'))}};
  r.readAsText(f);
}

/* ---------- router ---------- */
function render(){
  if(Q){renderCard();return}
  if(NAV==='home')renderHome();
  else if(NAV==='browse')renderBrowse();
  else if(NAV==='stats')renderStats();
  else if(NAV==='set')renderSet();
}
document.addEventListener('keydown',e=>{
  if(!Q)return;
  if(e.code==='Space'){e.preventDefault();const b=app.querySelector('[data-a=reveal]');if(b)b.click()}
  if(['1','2','3'].includes(e.key)){const b=app.querySelector(`[data-a=grade][data-l="${e.key}"]`);if(b)b.click()}
  if(e.key==='Enter'){const b=app.querySelector('[data-a=next]');if(b)b.click()}
});
render();
</script>
</body>
</html>
